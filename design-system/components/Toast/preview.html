<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div id="root" class="ds-pad"></div>
<script>
  var A = window.Aly, h = React.createElement;

    h('div',{style:{position:'relative',height:'60px'}},h(A.Toast,{show:true,style:{position:'absolute',bottom:'8px'}},'✓ email copied to clipboard'))
  );
</script>
</body>
