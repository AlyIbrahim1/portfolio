<!-- @dsCard group="Navigation" height=620 subtitle="Wide and narrow, at the top and scrolled, plus the open menu" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NavBar — preview</title>
<style>
  .nb-grid { display: grid; gap: var(--space-4); padding: var(--space-4); }
  .nb-row { display: grid; grid-template-columns: 390px 1fr; gap: var(--space-4); align-items: start; }
  .nb-cap { margin: 0 0 var(--space-2); font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-tertiary); }
  .nb-stage { position: relative; height: 92px; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--border-hairline); }
  .nb-stage.tall { height: 316px; }
  .nb-stage .nav { padding-left: var(--space-3); padding-right: var(--space-3); padding-top: var(--space-3); }
  /* what sits behind the bar: the hero glow at the top of the page, page content once scrolled */
  .nb-top { background: radial-gradient(75% 140% at 50% 0%, rgba(214,52,40,0.45) 0%, rgba(150,32,28,0.22) 45%, rgba(20,18,16,0) 82%), var(--bg-surface); }
  .nb-scroll { background: var(--bg-canvas); }
  .nb-lines { position: absolute; left: var(--space-6); right: var(--space-6); top: 22px; display: grid; gap: 10px; }
  .nb-lines i { display: block; height: 8px; border-radius: var(--radius-full); background: var(--border-strong); }
  .nb-lines i:nth-child(1) { width: 62%; background: var(--ink-secondary); }
  .nb-lines i:nth-child(2) { width: 88%; } .nb-lines i:nth-child(3) { width: 74%; } .nb-lines i:nth-child(4) { width: 81%; } .nb-lines i:nth-child(5) { width: 46%; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Aly, h = React.createElement;
  var links = [{href:'#stack',label:'Stack'},{href:'#work',label:'Work'},{href:'#experience',label:'Experience'},{href:'#contact',label:'Contact'}];
  function lines() { return h('div', { className: 'nb-lines', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i'), h('i')); }
  function stage(cap, layout, scrolled, open, tall) {
    return h('div', null,
      h('p', { className: 'nb-cap' }, cap),
      h('div', { className: 'nb-stage ' + (scrolled ? 'nb-scroll' : 'nb-top') + (tall ? ' tall' : '') },
        scrolled ? lines() : null,
        h(A.NavBar, { position: 'absolute', layout: layout, scrolled: scrolled, defaultOpen: open, name: 'Aly Ibrahim', active: '#work', links: links, cta: { href: '#contact', label: 'Let’s talk' } })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'nb-grid' },
      stage('Wide · top of page', 'wide', false),
      stage('Wide · scrolled', 'wide', true),
      h('div', { className: 'nb-row' },
        h('div', { style: { display: 'grid', gap: 'var(--space-4)' } },
          stage('Narrow · top of page', 'narrow', false),
          stage('Narrow · scrolled', 'narrow', true)),
        h('div', { style: { maxWidth: '390px' } }, stage('Narrow · menu open', 'narrow', true, true, true))))
  );
</script>
</body>
</html>
