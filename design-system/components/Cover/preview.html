<!-- @dsCard height=320 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aly Ibrahim</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-canvas); color:var(--ink-primary); overflow:hidden; }
  body::before { display:none; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .cv-ember { fill:var(--ember-500); }
  .cv-ember-deep { fill:var(--ember-600); }
  .cv-chrome { fill:var(--ink-primary); }
  .cv-steel { fill:var(--border-strong); }
  .cv-hot { fill:var(--ember-400); }
  .cv-io { fill:var(--border-outline); }
  .cv-cut { fill:var(--bg-canvas); }
  .cv-blk { rx:var(--radius-lg); }
  .cv-tile { rx:var(--radius-md); }
  .cv-pill { rx:4px; ry:4px; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:96px; line-height:.95; font-weight:400; letter-spacing:-.03em; color:var(--ink-primary); }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--ink-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      ember-500 144×312 slab bled off the top (the brand's light) · border-strong steel 192×200 bleeding off the right · ink-primary chrome 96×112 · ember-600 48×32 tint — ≈32% of 960×320
  arrangement one tall ember slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     trace-span pills, from the RequestTrace "spans as a waterfall" and radius-full span bars: space-2-tall pills stepping right at a space-6 pitch — compute spans ember-400, io spans border-outline, cut into the steel block in bg-canvas
  scales      sides in space-4/space-8 multiples; gutters space-4; pitch space-6; corners radius-lg, radius-md; pill rx half of space-2
-->
<rect class="cv-ember cv-blk" x="16" y="-16" width="144" height="312" rx="14"/>
<rect class="cv-ember-deep cv-tile" x="176" y="128" width="48" height="32" rx="8"/>
<rect class="cv-chrome cv-tile" x="176" y="184" width="96" height="112" rx="8"/>
<rect class="cv-steel cv-blk" x="288" y="96" width="208" height="200" rx="14"/>
<!-- waterfall on the ground, above the steel block -->
<rect class="cv-hot cv-pill" x="176" y="24" width="288" height="8"/>
<rect class="cv-io cv-pill" x="184" y="48" width="40" height="8"/>
<rect class="cv-io cv-pill" x="224" y="72" width="80" height="8"/>
<!-- continuing inside the steel block, cut out of it -->
<rect class="cv-cut cv-pill" x="304" y="120" width="48" height="8"/>
<rect class="cv-hot cv-pill" x="344" y="144" width="104" height="8"/>
<rect class="cv-cut cv-pill" x="440" y="168" width="24" height="8"/>
<rect class="cv-cut cv-pill" x="304" y="192" width="136" height="8"/>
<rect class="cv-hot cv-pill" x="320" y="216" width="64" height="8"/>
<rect class="cv-cut cv-pill" x="384" y="240" width="72" height="8"/>
<rect class="cv-hot cv-pill" x="304" y="264" width="24" height="8"/>
<!-- three spans cut into the ember slab -->
<rect class="cv-cut cv-pill" x="32" y="224" width="96" height="8"/>
<rect class="cv-cut cv-pill" x="56" y="248" width="48" height="8"/>
<rect class="cv-cut cv-pill" x="32" y="272" width="24" height="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Aly<br>Ibrahim</h1>
<p class="tag">Backend systems for AI products.</p>
</div>
</div>
</body>
</html>
