<!doctype html>
<html lang="en">
  <head>
    <!-- Document basics -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aly Ibrahim · Engineer</title>

    <!-- SEO -->
    <meta name="description" content="Aly Ibrahim — engineering production systems and AI products. CS student at the University of London, based in Cairo." />
    <meta name="author" content="Aly Ibrahim" />
    <link rel="canonical" href="https://alyibrahim1.github.io/portfolio/" />

    <!-- Icons: PNG for browsers without SVG favicons, SVG for the rest,
        apple-touch-icon for iOS favorites, bookmarks and home screen -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@300..700&display=swap" />

    <!-- Open Graph (LinkedIn, Facebook, link previews) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Aly Ibrahim" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Aly Ibrahim · Engineer" />
    <meta property="og:description" content="Engineering production systems and AI products. CS student at the University of London, based in Cairo." />
    <meta property="og:url" content="https://alyibrahim1.github.io/portfolio/" />
    <meta property="og:image" content="https://alyibrahim1.github.io/portfolio/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="Aly Ibrahim's portfolio: “Engineering production systems and AI products” beside a request trace panel." />

    <!-- Open Graph profile -->
    <meta property="profile:first_name" content="Aly" />
    <meta property="profile:last_name" content="Ibrahim" />

    <!-- Twitter / X card (falls back to og:* for title, description and image) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Aly Ibrahim's portfolio: “Engineering production systems and AI products” beside a request trace panel." />

    <!-- Structured data (schema.org Person) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Aly Ibrahim",
        "url": "https://alyibrahim1.github.io/portfolio/",
        "image": "https://alyibrahim1.github.io/portfolio/og.jpg",
        "description": "Engineering production systems and AI products. CS student at the University of London, based in Cairo.",
        "address": { "@type": "PostalAddress", "addressLocality": "Cairo", "addressCountry": "EG" },
        "affiliation": { "@type": "CollegeOrUniversity", "name": "University of London" },
        "sameAs": ["https://github.com/AlyIbrahim1", "https://www.linkedin.com/in/alyibrahim1"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
