<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Aly Ibrahim</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@400;600&display=swap" />
    <!-- Standalone page served by the Worker for unknown paths, so it inlines
        the design-system tokens it needs instead of loading the app bundle. -->
    <style>
      :root {
        --bg-canvas: #0b0a09;
        --ink-primary: #f4efe9;
        --ink-secondary: #b6aca4;
        --ink-inverse: #15110f;
        --space-2: 8px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-sm: 4px;
        --gutter: clamp(24px, 5vw, 96px);
        --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.45);
        --shadow-glow-chrome: 0 0 0 1px rgba(255,255,255,0.18), 0 6px 20px rgba(255,236,226,0.14);
        --shadow-focus-ring: 0 0 0 3px rgba(224,57,47,0.55);
        --gradient-chrome: linear-gradient(180deg, #ffffff 0%, #f1ece7 38%, #d9d2cb 52%, #ece6e0 74%, #faf7f4 100%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--gutter);
        background: var(--bg-canvas);
        color: var(--ink-primary);
        font-family: var(--font-sans);
      }
      main { max-width: 40rem; }
      .eyebrow { margin: 0 0 var(--space-4); font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-secondary); }
      h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
      h1 strong { font-weight: 600; }
      p.note { margin: var(--space-6) 0 var(--space-8); font-size: 18px; line-height: 1.6; color: var(--ink-secondary); }
      .btn { display: inline-flex; align-items: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-4); font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: 1; letter-spacing: -0.005em; text-decoration: none; color: var(--ink-inverse); background: var(--gradient-chrome); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.18); transition: box-shadow 150ms ease-out, transform 150ms ease-out; }
      .btn:hover { box-shadow: var(--shadow-glow-chrome), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.18); }
      .btn:focus-visible { outline: none; box-shadow: var(--shadow-focus-ring), inset 0 1px 0 rgba(255,255,255,0.9); }
      .btn:active { transform: translateY(1px); }
      .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · not found</p>
      <h1>There’s <strong>nothing here</strong>.</h1>
      <p class="note">The page you’re looking for doesn’t exist or has moved.</p>
      <a class="btn" href="/">Back to the homepage<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></a>
    </main>
  </body>
</html>
